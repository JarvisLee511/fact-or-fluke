name: cloud-probe

# Manual check: can GitHub-hosted runners reach the data sources the daily pipeline needs?
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOF_HTTP_RETRIES: "0"
      FOF_HTTP_TIMEOUT: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -e .
      - run: python scripts/phase0_probe.py
